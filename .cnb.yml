# 腾讯 CNB 云原生开发流水线 —— ⚠ 仅用于「开发时自测」，不是游戏服务器
#
# 【定位纠正 · 上一版踩过的坑】
#   云原生开发的端口预览（https://<环境ID>-3001.cnb.run）不能当长期游戏入口：
#     1) <环境ID> 每次环境重建都变 → 分享出去的链接立刻失效；
#     2) 离线约 10 分钟环境被平台回收 → 链接直接打不开；
#     3) cnb.run 是通配域名，环境不存在时一律 302 跳回 cnb.cool
#        → 这就是"点开是写代码的网站、不是游戏、没法玩"的直接原因。
#
# 【本文件的用途】改完代码，起个环境随手看一眼页面/WS 正不正常。
#   分支页点「云原生开发」→ 自动 npm ci + build + 起服务器（0.0.0.0:3001）+ HTTP 自检；
#   自测入口：本机 curl http://127.0.0.1:3001/healthz，或 WebIDE 的 PORTS 面板映射 3001。
#
# 【长期可玩的公网入口】请看 deploy/README.md —— 常驻 Docker / 腾讯云轻量，
#   入口固定如 http://<服务器IP>:3001，重启不变、7x24 在线、延迟只取决于物理链路。
#
# 注意：
#   - 服务必须监听 0.0.0.0（server/index.mjs 默认如此），只听 127.0.0.1 预览代理回源不到；
#   - 本文件必须在**目标分支自身**存在，否则该分支的「云原生开发」起不来（见 PR #2 说明）；
#   - 这里的 stages 只装依赖/构建/起服务，不要占用 3001，避免与服务器抢端口。
$:
  vscode:
    - runner:
        cpus: 4
      docker:
        image: node:20
      services:
        - vscode
        - docker
      env:
        PORT: "3001"
        HOST: "0.0.0.0"
      stages:
        - name: install-deps
          script: npm ci
        - name: build-dist
          script: npm run build
        - name: start-tank-server
          script:
            - pkill -f "node server/index.mjs" || true
            - nohup node server/index.mjs > /tmp/tank-server.log 2>&1 &
            - sleep 2
            - cat /tmp/tank-server.log
            # 自检：本机 3001 必须 HTTP 200，否则算失败，避免"环境起来了但服务没起"
            - |
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/ || true)
              echo "本机 3001 自检 HTTP=$code"
              [ "$code" = "200" ] || { echo "服务器未就绪"; exit 1; }
            # 打印公网地址（注意：必须给 {{port}} 替换值，直接输出模板串会得到带 {{port}} 的无效地址）
            - node scripts/net-tunnel.mjs

# ── Issue/PR 里 @NPC 触发：起服务 + 自检 + 延迟报告，可复现 ──
# 触发：在本仓库 Issue/PR 评论里 @CodeBuddy（npc 事件），本流水线自动跑一遍。
issue.comment@npc:
  - runner:
      cpus: 4
    docker:
      image: node:20
    env:
      PORT: "3001"
      HOST: "0.0.0.0"
    stages:
      - name: install-deps
        script: npm ci
      - name: build-dist
        script: npm run build
      - name: start-server-and-selfcheck
        script:
          - pkill -f "node server/index.mjs" || true
          - nohup node server/index.mjs > /tmp/tank-server.log 2>&1 &
          - sleep 2
          - cat /tmp/tank-server.log
          - |
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/ || true)
            ws=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3001/?room=1" || true)
            echo "本机 3001 自检: / => $code, /?room=1 => $ws"
            [ "$code" = "200" ] || { echo "服务器未就绪"; exit 1; }
      - name: tunnel-latency-report
        script:
          - node scripts/net-tunnel.mjs
          - |
            if [ -n "$CNB_VSCODE_PROXY_URI" ]; then
              node scripts/net-latency.mjs "${CNB_VSCODE_PROXY_URI//\{\{port\}\}/3001}" http://127.0.0.1:3001 || true
            else
              echo "无 CNB_VSCODE_PROXY_URI：仅本机基线（见下）"
              node scripts/net-latency.mjs http://127.0.0.1:3001 || true
            fi
