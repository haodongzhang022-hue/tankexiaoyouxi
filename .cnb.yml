# 腾讯 CNB 流水线 —— 只做 **CI 门禁**（云端不构建运行环境），跑起来的游戏在本地
#
# 【本项目的分工（用户口径，2026-09-19 定）】
#   · 云端（CNB）：改代码 + 跑门禁（tsc / build / vitest / net:entry-test）+ 出 PR；
#   · 本地：起服务器、真机点、真机跑 e2e —— 云 CPU 不够用，跑环境的事一律放本地。
#
#   所以这里**没有**「云原生开发当临时服务器/临时公网入口」那一段了。
#   要起环境请在本机：`npm run online`（起服务器 3001，本机/局域网直接开玩）
#                   `npm test`     （门禁四件套）
#                   `sh scripts/e2e/run-verify.sh`（真机 e2e，需下载 Chromium，**只在本地跑**）
#   长期固定公网入口见 deploy/README.md（Docker / 云主机，http://<IP>:3001 重启不变）。
#
# 【历史坑位（仍然适用，勿回退）】
#   · 服务必须监听 0.0.0.0（server/index.mjs 默认如此），只听 127.0.0.1 时端口预览/反代回源不到；
#   · 【稳定链接 v3.0】服务器启动后打印「稳定链接」`<当前域名>/<sid>/join/<房间号>`：
#     域名/IP 变了由服务器 302 自动匹配；同一进程内 sid 恒定，重启/换环境才换新。
#     自测：npm run net:entry-test。
#   · 【入口只信可信来源 v3.0.2】「当前入口」**不采信进站请求的 Host**（Host 可伪造 → 钓鱼链接）。
#     优先级：① 带一次性令牌的显式登记（GET /entry/register?url=<IP 或域名>，令牌在
#     $TANK_ENTRY_TOKEN_FILE，默认 /tmp/tank-entry-<port>.token，0600；登记结果落盘 .url）
#     → ② 平台预览模板（含残留占位符一律作废）→ ③ 服务器自己找的本机入口。
#     **IP 形态部署同样可登记**：http://203.0.113.9:3001 / http://192.168.1.50:3001 都能当入口；
#     没有任何入口时给可操作提示页，**绝不**把好友 302 到 127.0.0.1（那会指向他自己机器）。
#   · 【玩家开箱可玩 v3.0.3】入口不需要任何手动前置：服务器启动自己找一次并落盘，打开就玩。
#     TANK_AUTO_ENTRY=0 可关。
#   · 【/entry/localtip 准入加固 v3.0.4（Issue #15 🔴）】可达性上报只放行：① 带一次性令牌；
#     ② 本机/同内网自救（上报地址 = 服务器自己网卡的 IP + 私网/回环对端）。其余一律 403 且入口不变。
#     自测：npm run net:entry-test。
#   · 【error 帧机器码 v2.41（Issue #16 D1）】加入房间失败的 error 帧带 `code`
#     （room_full / room_not_found / room_playing …），前端按码决定"要不要重试"，文案只做展示。
#     契约在 shared/net-error-codes.mjs，判定在 src/net/JoinError.ts，两端各有一条回归锁。
#
# ⚠⚠ 阶段脚本两个「真机踩过」的坑（改本文件前必读，勿回退）：
#
#   坑 1｜`script` 写成 YAML 数组 + 后台启动项以 `&` 结尾 → 整条命令一条都不执行
#     平台对数组型 script 会把各项用 ` && ` 拼成**单行** `sh -c` 执行；`... 2>&1 &` 后接 `&&`
#     得到 `... 2>&1 & && sleep 2 ...` → `sh: Syntax error: "&&" unexpected`，
#     连前面的 pkill 都不跑，stage 秒失败（143ms / code 2）。
#     → 本文件所有阶段脚本统一用**块标量 `script: |`**（项间无 `&&` 拼接），
#       且后台启动一律包进子 shell `( ... & )`，任何拼接语义下都不会出现尾随裸 `&`。
#     ⚠ 反例（曾写进 Issue #3 的「修正示例」里，**照抄必挂，已实测失败**）：
#         script: |
#           nohup node server/index.mjs > /tmp/tank-server.log 2>&1 &
#           sleep 2
#       块标量下每行都是独立命令，`&` 只把 nohup 放后台并**立即**执行下一行；
#       父 shell 退出时子进程收到 SIGHUP/SIGTERM → `code 143`，且日志里后续输出全丢。
#       必须写成子 shell：`( nohup ... > log 2>&1 & echo $! > pid )`。
#
#   坑 2｜`pkill -f "<脚本里出现过的字符串>"` 会**杀掉自己**
#     平台把整段脚本作为 `sh -c "<脚本文本>"` 执行，该 shell 的**命令行里就含脚本文本**；
#     `pkill -f "node server/index.mjs"` 因此匹配到自身 → 自己给自己 SIGTERM →
#     stage 以 `code 143`（signal SIGTERM）秒失败，且**看不到任何后续输出**。
#     → 本文件**不用 `pkill -f`**：改用「先探 /healthz 复用、否则按 PID 文件收旧进程」。
#
#   坑 3｜**别在 `issue.comment@npc` 里起长驻服务**（NPC 任务的载体就是这条流水线）
#     在里面 `nohup` 常驻进程 = 把模型和后台服务塞进同一容器同一会话 → 抢资源、
#     stage 收不了尾、整条流水线最后被平台掐掉（实测最长 error 构建 1h37.5m，
#     `npc go` 独占 5839738ms，报 `Pipeline has been stopped, Agent aborted`）。
#     → NPC 事件流水线**只留给 NPC**；要验证"服务器 + 联机 + 延迟"请在本机跑。
#     本项目 NPC 行为走平台内置 npc:go（镜像 cnbcool/default-npc:latest），
#     不依赖本文件声明 issue.comment@npc；若确需定制，骨架只放 `type: npc:go`，不放起服务。

# ── CI 门禁：纯校验，不起常驻服务、不下载浏览器 ──
# 触发：pull_request（PR 创建/重新打开/源分支 push）→ 每个 PR 都有一道门。
# 取 4 核（默认 8 核 16G 属"高负载"，本仓库门禁是纯 CPU 轻活，省核）→ 对齐用户"云 CPU 不够用"。
# 跑什么：npm ci → tsc → vite build → vitest → net:entry-test → net:server-test
#         （后两条都是纯 node --test：自起服务器、自选随机端口，不下浏览器、不起常驻服务）。
# 不跑什么：真机 e2e（要下 Chromium ~400MB + 三个服务）、延迟实测 —— 那是**本地**的事。
main:
  pull_request:
   - runner:
       cpus: 4
     docker:
       image: node:20
     stages:
      - name: install-deps
        script: npm ci
      - name: typecheck
        script: npx tsc --noEmit
      - name: build-dist
        script: npm run build
      - name: unit-tests
        # 入库单测：InviteLink / JoinError（error 帧机器码判定）/ RtcPeer / sync-core
        script: npx vitest run
      - name: stable-entry-regression
        # 稳定入口 + error 帧机器码的回归锁（真起服务器、真发 HTTP/WebSocket，随机端口）
        script: npm run net:entry-test
      - name: server-access-regression
        # 【为什么必须有这一条（评审 🔴：CI 的准入锁曾是假锁）】
        #   net:entry-test 是**本地**工具（它要下 Chromium 那套 e2e 环境），云端被跳过；
        #   于是"谁能在什么状态下做什么"（座位容量 / 发起者归属 / 重连与加入的分工）
        #   在 CI 里**完全没有门禁** —— 服务端改坏了 PR 照样绿。
        #   本阶段是纯 node --test：自起 server/index.mjs（随机端口）+ 真发 WebSocket，
        #   不下浏览器、不起常驻服务，几秒跑完，适合云端。
        script: npm run net:server-test
# 说明：不再为 `pull_request.update` 再挂一条重复流水线 —— 门禁只跑一条，
# 改标题/描述不需要重跑构建（省云 CPU）。要手动重跑，用 PR 页面的「重新构建」。

# ── Issue/PR 里 @NPC 触发：只给 NPC 环境，不起任何常驻服务 ──
# 触发：在本仓库 Issue/PR 评论里 @CodeBuddy（npc 事件）。
# ⚠ 这里**刻意什么都不配置**：本项目的 NPC 行为走平台内置 npc:go，
#   而"在 NPC 事件里起服务器"正是历史上把任务拖到 1h37m 被平台掐掉的根因（见文件头「坑 3」）。
#   需要给 NPC 一份环境时，用 `services:` 声明配套服务（平台托管生命周期），
#   而**不是**在 stage 里 `nohup` 一个和 Agent 抢资源的进程。
#
# 若后续确需定制 NPC 行为，正确骨架长这样（注意 stages 里只有 npc:go，没有起服务）：
#
#   issue.comment@npc:
#     - docker:
#         image: cnbcool/default-npc:latest
#       stages:
#         - name: npc go
#           type: npc:go
